# Eclipseal on eclipseal.xyz. Self-contained: it answers only for eclipseal.xyz and www.eclipseal.xyz
# and proxies to Eclipseal's two loopback services, so other sites on this nginx are unaffected.
# certbot --nginx adds the HTTPS listener and the HTTP -> HTTPS redirect to this file.

upstream eclipseal_web {
    server 127.0.0.1:3330;
    keepalive 16;
}

upstream eclipseal_api {
    server 127.0.0.1:4330;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name eclipseal.xyz www.eclipseal.xyz;

    # One address for the site: www goes to the bare domain.
    if ($host = www.eclipseal.xyz) {
        return 301 $scheme://eclipseal.xyz$request_uri;
    }

    client_max_body_size 512k;
    access_log /var/log/nginx/eclipseal.access.log;
    error_log /var/log/nginx/eclipseal.error.log warn;

    # Live event stream (SSE): no buffering, long reads.
    location = /api/events {
        proxy_pass http://eclipseal_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # The API lives under /api and /v1 on the same origin, so the browser never needs CORS.
    # Buffering is off because chat completions stream.
    location ~ ^/(api|v1)/ {
        proxy_pass http://eclipseal_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://eclipseal_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
